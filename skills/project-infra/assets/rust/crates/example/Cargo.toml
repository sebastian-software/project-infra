# Member crate. Inherits the workspace metadata and lint policy.
[package]
name = "example"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Only for a published crate. docs.rs builds with every feature and sets the
# `docsrs` cfg, so feature annotations render there; the rustdoc job passes the
# same flags and fails on a warning before publication.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
