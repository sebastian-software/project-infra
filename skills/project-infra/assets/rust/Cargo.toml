# Workspace root. Members opt into the shared package metadata and lint policy.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
# Safe-Rust default. Where native integration needs unsafe code, replace this
# with `unsafe_op_in_unsafe_fn = "deny"` and document each safety argument.
unsafe_code = "forbid"

[workspace.lints.rustdoc]
# A broken intra-doc link only shows up as missing documentation on docs.rs.
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Debugging leftovers and unfinished branches fail the gate instead of shipping.
dbg_macro = "deny"
todo = "deny"
# Add a rule like this one once the defect it catches has occurred here.
# unwrap_used = "deny"

# Profile for a crate that builds a Node addon (`crate-type = ["cdylib"]`).
# Unwinding keeps a panic inside the addon, where the binding turns it into a
# JavaScript error, instead of aborting the process that loaded it. Cargo reads
# profiles only from the workspace root manifest.
[profile.release-node]
inherits = "release"
panic = "unwind"
