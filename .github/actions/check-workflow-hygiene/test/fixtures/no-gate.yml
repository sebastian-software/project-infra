# Split checks without an aggregate job for branch protection to require.
name: No gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: no-gate-${{ github.ref }}

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo node

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo rust
