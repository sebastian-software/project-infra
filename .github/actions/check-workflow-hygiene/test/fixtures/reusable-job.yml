# A job that calls a reusable workflow cannot carry `timeout-minutes`.
name: Reusable job

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reusable-${{ github.ref }}

jobs:
  called:
    uses: ./.github/workflows/reusable.yml

  local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo local
