# Every rule satisfied, including the aggregate gate job.
name: Passing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo node

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: echo rust

  gate:
    needs: [node, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.node.result }}" = "success"
