name: verify musl native package
description: >-
  Build a native Node addon on a musl host and load it in a musl Node runtime,
  so a musl platform package is proven to run before it reaches consumers.

inputs:
  package-dir:
    description: >-
      Directory of the platform package, relative to the repository root. Both
      containers run with it as their working directory.
    required: true
  binary:
    description: >-
      Addon file name inside that directory, as napi-matrix derives it from the
      package name and the platform id. The load step requires this file.
    required: true
  target:
    description: >-
      Rust target of the musl build. Its architecture has to match the runner,
      because the containers execute the artifact instead of emulating it.
    required: true
  build-command:
    description: >-
      Shell command that builds the addon into the package directory. It runs
      in the build container with RUST_TARGET set to the target input.
    required: true
  build-image:
    description: Build container image; a musl host carrying a Rust toolchain.
    required: false
    default: rust:alpine
  build-packages:
    description: >-
      apk packages installed before the build command. The Rust image carries
      neither a linker nor a Node.js interpreter for the build script.
    required: false
    default: nodejs build-base
  run-image:
    description: Load container image; the musl Node runtime a consumer installs into.
    required: false
    default: node:lts-alpine
  required-export:
    description: >-
      Name of a function the loaded addon has to expose. Empty checks only that
      the addon loads.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A musl artifact runs only on the architecture it was built for, and a
    # GitHub runner has no emulation installed, so an architecture mismatch is
    # reported here instead of as a confusing container failure.
    - name: Check the target against the runner
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
      run: |
        set -eu
        case "$INPUT_TARGET" in
          *-linux-musl*) ;;
          *)
            echo "verify-musl-native: $INPUT_TARGET is not a musl target." >&2
            exit 1
            ;;
        esac
        case "${INPUT_TARGET%%-*}" in
          x86_64) needed=X64 ;;
          aarch64) needed=ARM64 ;;
          *)
            echo "verify-musl-native: no runner architecture is known for $INPUT_TARGET." >&2
            exit 1
            ;;
        esac
        if [ "$needed" != "$RUNNER_ARCH" ]; then
          echo "verify-musl-native: $INPUT_TARGET needs runner architecture $needed; this job runs on $RUNNER_ARCH." >&2
          exit 1
        fi

    - name: Build the addon on a musl host
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_BUILD_COMMAND: ${{ inputs.build-command }}
        INPUT_BUILD_IMAGE: ${{ inputs.build-image }}
        INPUT_BUILD_PACKAGES: ${{ inputs.build-packages }}
        INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_TARGET: ${{ inputs.target }}
      run: |
        set -eu
        # The package list is deliberately unquoted inside the container, so
        # that a space-separated list reaches apk as separate arguments.
        docker run --rm \
          --volume "$PWD:/workspace" \
          --workdir "/workspace/$INPUT_PACKAGE_DIR" \
          --env "BUILD_COMMAND=$INPUT_BUILD_COMMAND" \
          --env "BUILD_PACKAGES=$INPUT_BUILD_PACKAGES" \
          --env "RUST_TARGET=$INPUT_TARGET" \
          "$INPUT_BUILD_IMAGE" \
          sh -c 'if [ -n "$BUILD_PACKAGES" ]; then apk add --no-cache $BUILD_PACKAGES; fi; eval "$BUILD_COMMAND"'
        if [ ! -f "$INPUT_PACKAGE_DIR/$INPUT_BINARY" ]; then
          echo "verify-musl-native: the build left no $INPUT_BINARY in $INPUT_PACKAGE_DIR." >&2
          exit 1
        fi

    - name: Load the addon in a musl Node runtime
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_PACKAGE_DIR: ${{ inputs.package-dir }}
        INPUT_REQUIRED_EXPORT: ${{ inputs.required-export }}
        INPUT_RUN_IMAGE: ${{ inputs.run-image }}
      run: |
        set -eu
        probe=$(cat <<'JS'
        import { createRequire } from "node:module"
        const addon = createRequire(import.meta.url)("./" + process.env.ADDON)
        const required = process.env.REQUIRED_EXPORT
        if (required.length > 0 && typeof addon[required] !== "function") {
          throw new Error(process.env.ADDON + " loaded, but exports no " + required + " function")
        }
        console.log(process.env.ADDON + " loads on musl")
        JS
        )
        docker run --rm \
          --volume "$PWD:/workspace" \
          --workdir "/workspace/$INPUT_PACKAGE_DIR" \
          --env "ADDON=$INPUT_BINARY" \
          --env "REQUIRED_EXPORT=$INPUT_REQUIRED_EXPORT" \
          "$INPUT_RUN_IMAGE" \
          node --input-type=module --eval "$probe"
